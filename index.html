<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="9HvV_MPXWlPB06KMwelS_sWi2caNCp8y-pN2Q0XkAzA" />
  <title>MINIMA by NOVA AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://pyscript.net">
  <script type="module" src="https://pyscript.net"></script>
</head>

<body>
  <div class="app-container">
    <div class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99z" />
        </svg>
        <span>MINIMA</span>
      </div>
      <div class="menu-label">Recent Chats</div>
      <div class="sidebar-item active">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor"
            d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-.2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z" />
        </svg>
        Current Session
      </div>
    </div>

    <div class="main-chat">
      <div class="chat-header">
        <div class="header-meta">
          <div class="engine-badge">MINIMA</div>
          <div class="status-indicator">
            <div class="pulse-ring"></div>
            <div class="status-core"></div>
            <span>MINIMA Engine Connected</span>
          </div>
        </div>
      </div>

      <div id="box">
        <div class="msg-bubble bot-msg">
          Hello! I am MINIMA, your local intelligence engine. How can I assist your workflow today?
        </div>
      </div>

      <div class="input-container">
        <div class="input-wrapper">
          <input type="text" id="msg" placeholder="Message MINIMA...">
          <!-- Removed old py-click to let script.js listen correctly -->
          <button id="sendBtn">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Links your script.js logic right into your document -->
  <script src="script.js"></script>
  <script type="py" src="main.py"></script>
</body>
</html>
