<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="9HvV_MPXWlPB06KMwelS_sWi2caNCp8y-pN2Q0XkAzA" />
  <title>MINIMA by NOVA AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <div class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99z" />
        </svg>
        <span>MINIMA</span>
      </div>
      <div class="menu-label">Recent Chats</div>
      <div class="sidebar-item active">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor"
            d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-.2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z" />
        </svg>
        Current Session
      </div>
    </div>

    <div class="main-chat">
      <div class="chat-header">
        <div class="header-meta">
          <div class="engine-badge">MINIMA</div>
          <div class="status-indicator">
            <div class="pulse-ring"></div>
            <div class="status-core"></div>
            <span>MINIMA Engine Connected</span>
          </div>
        </div>
      </div>

      <div id="box">
        <div class="msg-bubble bot-msg">
          Hello! I am MINIMA, your local intelligence engine. How can I assist your workflow today?
        </div>
      </div>

      <div class="input-container">
        <div class="input-wrapper">
          <input type="text" id="msg" placeholder="Message MINIMA...">
          <button id="sendBtn">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "THE_KEY_WILL_BE_HERE";
    const BASE_URL = "https://googleapis.com";
    const SYSTEM_INSTRUCTION = "Your name is Minima. You are a precise coding assistant. CRITICAL: Whenever you generate, show, or mention code, you MUST wrap it inside proper markdown code blocks with the correct language identifier (e.g., ```python ... ```).";

    const box = document.getElementById('box');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('sendBtn');

    function formatMarkdownText(text) {
      const regex = /```(\w*)\n([\s\S]*?)\n```/g;
      let matches = [];
      let match;

      while ((match = regex.exec(text)) !== null) {
        matches.push({
          full: match[0],
          lang: match[1],
          code: match[2],
          index: match.index,
        });
      }

      if (matches.length === 0) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/\n/g, '<br>').replace(/  /g, '&nbsp;&nbsp;');
      }

      let lastIndex = 0;
      let resultHTML = '';

      matches.forEach((m) => {
        let plainText = text.substring(lastIndex, m.index);
        if (plainText) {
          const div = document.createElement('div');
          div.textContent = plainText;
          resultHTML += div.innerHTML.replace(/\n/g, '<br>').replace(/  /g, '&nbsp;&nbsp;');
        }

        const displayLang = m.lang || 'code';
        const divEscape = document.createElement('div');
        divEscape.textContent = m.code;
        const escapedCode = divEscape.innerHTML;

        resultHTML += `
          <div class="code-container">
              <div class="code-header">
                  <span>${displayLang}</span>
                  <button class="copy-btn" onclick="copyCode(this)">Copy</button>
              </div>
              <pre><code>${escapedCode}</code></pre>
          </div>
        `;
        lastIndex = m.index + m.full.length;
      });

      let remainingText = text.substring(lastIndex);
      if (remainingText) {
        const div = document.createElement('div');
        div.textContent = remainingText;
        resultHTML += div.innerHTML.replace(/\n/g, '<br>').replace(/  /g, '&nbsp;&nbsp;');
      }

      return resultHTML;
    }

    function copyCode(button) {
      const container = button.closest('.code-container');
      const codeText = container.querySelector('pre code').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        button.innerText = 'Copied!';
        setTimeout(() => { button.innerText = 'Copy'; }, 2000);
      });
    }

    function appendMessage(text, isBot) {
      const bubble = document.createElement('div');
      bubble.className = isBot ? 'msg-bubble bot-msg' : 'msg-bubble user-msg';
      if (isBot) {
        bubble.innerHTML = formatMarkdownText(text);
      } else {
        bubble.textContent = text;
      }
      box.appendChild(bubble);
      box.scrollTop = box.scrollHeight;
    }

    function showLoadingIndicator() {
      const loader = document.createElement('div');
      loader.className = 'msg-bubble bot-msg loading-bubble';
      loader.id = 'chippy-loader';
      const textNode = document.createElement('span');
      textNode.id = 'loader-text';
      textNode.textContent = 'Thinking...';
      loader.appendChild(textNode);
      box.appendChild(loader);
      box.scrollTop = box.scrollHeight;

      const phrases = ['Thinking...', 'Cooking...', 'Modernizing...'];
      let index = 0;
      const intervalId = setInterval(() => {
        const element = document.getElementById('loader-text');
        if (element) {
          index = (index + 1) % phrases.length;
          element.textContent = phrases[index];
        } else {
          clearInterval(intervalId);
        }
      }, 1200);
      return intervalId;
    }

    function removeLoadingIndicator(intervalId) {
      clearInterval(intervalId);
      const loader = document.getElementById('chippy-loader');
      if (loader) loader.remove();
    }

    async function processChatCycle() {
      const userText = msgInput.value.trim();
      if (!userText) return;

      appendMessage(userText, false);
      msgInput.value = '';

      const animationId = showLoadingIndicator();

      const payload = {
        contents: [{ parts: [{ text: userText }] }],
        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
      };

      try {
        // Fixed: Swapped key query string layout to secure custom headers specification
        const response = await fetch(BASE_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-goog-api-key': API_KEY 
          },
          body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        
        if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
          const botResponse = data.candidates[0].content.parts[0].text;
          removeLoadingIndicator(animationId);
          // Fixed: Lowercased JavaScript syntax boolean to prevent runtime engine crashes
          appendMessage(botResponse, true);
        } else {
          removeLoadingIndicator(animationId);
          appendMessage("Engine Error: Received unreadable data structures from Gemini.", true);
          console.log(data);
        }
      } catch (error) {
        removeLoadingIndicator(animationId);
        appendMessage("Engine Connection Offline: Could not reach Gemini.", true);
        console.error(error);
      }
    }

    sendBtn.addEventListener('click', processChatCycle);
    msgInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        processChatCycle();
      }
    });
  </script>
</body>
</html>
