name: Inject Secret and Deploy

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Inject GitHub Secret Into PyScript File
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          # Uses linux sed command to swap the placeholder text with your real secret key safely
          sed -i "s|REPLACE_WITH_GITHUB_SECRET|$THE_KEY|g" main.py

      - name: Package Code
        run: |
          echo "Your secret has been safely bound to your code session!"
