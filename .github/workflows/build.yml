name: Deploy Live Website

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Inject Secret Token Safely
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          python3 -c "import os; f=open('index.html','r'); c=f.read(); f.close(); c=c.replace('THE_KEY_WILL_BE_HERE', os.environ['THE_KEY']); f=open('index.html','w'); f.write(c); f.close()"

      - name: Setup GitHub Pages Website Environment
        uses: actions/configure-pages@v5

      - name: Upload Page Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Live Link
        uses: actions/deploy-pages@v4
