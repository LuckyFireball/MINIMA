name: Deploy Minima Core Engine

on: [push]

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy Requirements
        run: |
          pip install google-genai fastapi uvicorn pydantic

      - name: Boot Secure API Service
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          python server.py
