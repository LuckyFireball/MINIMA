name: Publish Application

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast Key Injection
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          # This replaces the text placeholder instantly using an alternate separator to avoid character errors
          sed -i "s|REPLACE_WITH_GITHUB_SECRET|$THE_KEY|g" main.py

      - name: Create Version Tag
        id: tag
        run: echo "version=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish Script Instantly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Minima Release ${{ steps.tag.outputs.version }}
          files: main.py
