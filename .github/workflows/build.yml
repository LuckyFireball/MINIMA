name: Compile Standalone Application

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Inject Secret Token Natively
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          # Replaces the template string inside your script with your real repository token
          sed -i "s|REPLACE_WITH_GITHUB_SECRET|$THE_KEY|g" main.py

      - name: Install PyInstaller Binary Engine
        run: |
          pip install --prefer-binary pyinstaller google-genai

      - name: Compile to Production Executable
        run: |
          pyinstaller --onefile main.py

      - name: Upload Final Build to GitHub Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: minima-production-build
          path: dist/
