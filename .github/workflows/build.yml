name: Deploy Live Website

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Inject Secret Token Safely
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          # Uses standard Python to find the placeholder text inside index.html and overwrite it with your real key
          python3 -c "
          import os
          with open('index.html', 'r') as f:
              code = f.read()
          code = code.replace('THE_KEY_WILL_BE_HERE', os.environ.get('THE_KEY', ''))
          with open('index.html', 'w') as f:
              f.write(code)
          "

      - name: Setup GitHub Pages Website Environment
        uses: actions/configure-pages@v5

      - name: Upload Page Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Live Link
        uses: actions/deploy-pages@v4
