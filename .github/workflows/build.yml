name: Publish Cross-Platform Releases

on: [push]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller google-genai
      - run: pyinstaller --onefile --name="Minima-Engine-Windows" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: dist/Minima-Engine-Windows.exe

  build-mac:
    # CRITICAL: macos-13 is an Intel-based runner. This fixes "bad CPU type" forever!
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller google-genai
      - name: Compile Mac App
        run: |
          pyinstaller --onefile --name="Minima-Engine-Mac" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: mac-bin
          path: dist/Minima-Engine-Mac

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller google-genai
      - run: pyinstaller --onefile --name="Minima-Engine-Linux" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: dist/Minima-Engine-Linux

  publish-all-releases:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Minima Release v1.0.${{ github.run_number }}"
          files: |
            dist/Minima-Engine-Windows.exe
            dist/Minima-Engine-Mac
            dist/Minima-Engine-Linux
