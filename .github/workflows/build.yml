name: Publish Mac Application

on: [push]

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Gemini
        run: |
          pip install pyinstaller google-genai

      - name: Compile For Mac Architecture
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          # Explicitly targets your 2019 Intel 64-bit MacBook Pro processor setup
          pyinstaller --onefile --target-arch=x86_64 --name="Minima-Engine-Mac" main.py

      - name: Create Version Tag
        id: tag
        run: echo "version=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish to Public Releases Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Minima Mac Release ${{ steps.tag.outputs.version }}
          files: dist/Minima-Engine-Mac
