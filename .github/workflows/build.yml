name: Publish Application

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inject Secret From GitHub
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          sed -i "s|REPLACE_WITH_GITHUB_SECRET|$THE_KEY|g" main.py

      - name: Install PyInstaller and Gemini
        run: |
          pip install pyinstaller google-genai

      - name: Compile Executable
        run: |
          pyinstaller --onefile --name="Minima-Engine" main.py

      - name: Create Version Tag
        id: tag
        run: echo "version=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Minima Release ${{ steps.tag.outputs.version }}
          files: dist/Minima-Engine
