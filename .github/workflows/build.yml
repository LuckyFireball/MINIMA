name: Publish Cross-Platform Releases

on: [push]

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: Minima-Engine-Windows.exe
          - os: macos-latest
            artifact_name: Minima-Engine-Mac
          - os: ubuntu-latest
            artifact_name: Minima-Engine-Linux

    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Gemini
        run: |
          pip install pyinstaller google-genai

      # Step 1: Strictly compiles for your 2019 Intel 64-bit MacBook Pro
      if: matrix.os == 'macos-latest'
      - name: Compile For Mac
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          pyinstaller --onefile --target-arch=x86_64 --name="${{ matrix.artifact_name }}" main.py

      # Step 2: Compiles for Windows and Linux runners safely without syntax crashes
      if: matrix.os != 'macos-latest'
      - name: Compile For Windows and Linux
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          pyinstaller --onefile --name="${{ matrix.artifact_name }}" main.py

      - name: Create Version Tag
        id: tag
        shell: bash
        run: echo "version=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish to Public Releases Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Minima Multi-OS Release ${{ steps.tag.outputs.version }}
          files: |
            dist/Minima-Engine-Windows.exe
            dist/Minima-Engine-Mac
            dist/Minima-Engine-Linux
