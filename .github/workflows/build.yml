name: Deploy Serverless App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Hardcode Secret into Application
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          # Replaces the string placeholder with your repository secret
          sed -i 's|REPLACE_WITH_GITHUB_SECRET|'"$THE_KEY"'|g' main.py

      - name: Verify Build Setup
        run: |
          echo "Build finalized successfully. The key is wrapped natively within the runtime payload."
