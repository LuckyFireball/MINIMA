name: Publish Cross-Platform Releases

on: [push]

permissions:
  contents: write

jobs:
  # Job 1: Build the Windows App
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modules
        run: pip install pyinstaller google-genai

      - name: Compile For Windows
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: pyinstaller --onefile --name="Minima-Engine-Windows" main.py

      - name: Save Windows File
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: dist/Minima-Engine-Windows.exe

  # Job 2: Build the Mac App (For your 2019 MacBook Pro)
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modules
        run: pip install pyinstaller google-genai

      - name: Compile For Mac Architecture
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: pyinstaller --onefile --target-arch=x86_64 --name="Minima-Engine-Mac" main.py

      - name: Save Mac File
        uses: actions/upload-artifact@v4
        with:
          name: mac-bin
          path: dist/Minima-Engine-Mac

  # Job 3: Build the Linux App
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modules
        run: pip install pyinstaller google-genai

      - name: Compile For Linux
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: pyinstaller --onefile --name="Minima-Engine-Linux" main.py

      - name: Save Linux File
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: dist/Minima-Engine-Linux

  # Job 4: One single machine waits for everyone to finish and publishes them cleanly
  publish-all-releases:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Sync Code
        uses: actions/checkout@v4

      - name: Download Windows App
        uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: final-dist/

      - name: Download Mac App
        uses: actions/download-artifact@v4
        with:
          name: mac-bin
          path: final-dist/

      - name: Download Linux App
        uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: final-dist/

      - name: Create Version Tag
        id: tag
        run: echo "version=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish All Files to Releases Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Minima Multi-OS Release ${{ steps.tag.outputs.version }}
          files: |
            final-dist/Minima-Engine-Windows.exe
            final-dist/Minima-Engine-Mac
            final-dist/Minima-Engine-Linux
