name: Deploy Application Engine

on: [push]

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Runtime Requirements
        run: |
          pip install google-genai fastapi uvicorn pydantic

      - name: Run Server with GitHub Secret
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          python server.py
