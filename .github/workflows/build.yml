name: Publish Cross-Platform Releases

on: [push]

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: Minima-Engine-Windows.exe
          - os: macos-latest
            artifact_name: Minima-Engine-Mac
          - os: ubuntu-latest
            artifact_name: Minima-Engine-Linux

    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Gemini
        run: pip install pyinstaller google-genai

      # Compile for Mac (Your 2019 Intel 64-bit MacBook Pro)
      - name: Compile For Mac
        if: matrix.os == 'macos-latest'
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: pyinstaller --onefile --target-arch=x86_64 --name="${{ matrix.artifact_name }}" main.py

      # Compile for Windows
      - name: Compile For Windows
        if: matrix.os == 'windows-latest'
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: pyinstaller --onefile --name="${{ matrix.artifact_name }}" main.py

      # Compile for Linux
      - name: Compile For Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: pyinstaller --onefile --name="${{ matrix.artifact_name }}" main.py

      - name: Create Version Tag
        id: tag
        shell: bash
        run: echo "version=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      # Each runner uploads its own file directly to the same release page
      - name: Publish to Public Releases Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Minima Multi-OS Release ${{ steps.tag.outputs.version }}
          files: dist/${{ matrix.artifact_name }}
