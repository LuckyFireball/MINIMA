name: Deploy Live Website

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository Code
        uses: actions/checkout@v4

      - name: Inject Secret Token
        env:
          THE_KEY: ${{ secrets.THE_KEY }}
        run: |
          # Overwrites the text template string directly inside main.py with your private token
          sed -i "s|REPLACE_WITH_GITHUB_SECRET|$THE_KEY|g" main.py

      - name: Setup GitHub Pages Website Environment
        uses: actions/configure-pages@v5

      - name: Upload Page Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Live Link
        uses: actions/deploy-pages@v4
